services:

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - ./floci-data:/app/data
    restart: unless-stopped


  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    restart: unless-stopped

  storage-consumer:
    build:
      context: ./log-processor
    container_name: storage-consumer
    command: ["python", "-u", "storage_consumer.py"]
    depends_on:
      - kafka
      - loki
    restart: unless-stopped 

  analysis-consumer:
    build:
      context: ./log-processor
    container_name: analysis-consumer
    command: ["python", "-u", "analysis_consumer.py"]
    depends_on:
      - kafka
    restart: unless-stopped

  s3-consumer:
    build:
      context: ./log-processor
    container_name: s3-consumer
    command: ["python", "-u", "s3_consumer.py"]
    depends_on:
      - kafka
      - floci
    restart: unless-stopped